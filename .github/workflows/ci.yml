name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Deployment to Cloudflare is added when the bureau goes live (needs CLOUDFLARE_API_TOKEN
  # and the real D1 database ID in wrangler.jsonc).
