openapi: 3.1.0
info:
  title: PrUn Galactic Credit Bureau API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Public record of lending between Prosperous Universe players.

    **Reading needs no key.** Responses are cached for 60 seconds.

    **Rate limits** work as token buckets: a bucket holds a burst allowance and refills steadily.
    Every request draws on a bucket for its client address (bursts of 120, refilling 2 a second).
    Writes also draw on a bucket for the signed-in user or lender key (bursts of 60, refilling 1 a second).
    Responses carry `RateLimit-Limit` and `RateLimit-Remaining`. When a bucket is empty the answer is
    429 with `Retry-After` in seconds.

    **Editing** needs a Discord sign-in (a session cookie set by `/auth/login`) and must come from this site.
    Any signed-in user may edit any loan. Every change is recorded with who made it; see `/changes`.
    Loans with `autoTrack` on follow FIO: only `notes` and `autoTrack` can be changed on them, and they cannot be deleted.

    **Reporting** lets a lender's own tools record loans, with that lender's API key sent as
    `Authorization: Bearer <key>`. A lender creates the key on the Track my loans page after connecting FIO,
    which is what proves the account is theirs. A key can only report loans under its own lender.
    A lender may override what FIO says about their own loans: reporting different values switches FIO tracking
    off for that loan, and `/lenders/{username}/loans/{contractId}/tracking` switches it back on.

    Conventions:
    - Amounts are decimal strings (`"25000000.00"`) and always come with a currency. Amounts in
      different currencies are never added together, except in fields named `combined`, which add the
      four currencies at face value with no exchange rate applied. Treat those as a rough measure of scale.
    - `currency` is one of `AIC`, `CIS`, `ICA`, `NCC`, or `null` for lending that is not cash
      (for example a loan repaid in materials).
    - Usernames, company codes and contract IDs are case-insensitive.
    - "Total" figures leave out terminated loans. "Current" is In Progress plus Overdue.
servers:
  - url: /api/v1
tags:
  - name: Borrowers
  - name: Lenders
  - name: Loans
  - name: Bureau
  - name: Editing
    description: Needs a Discord sign-in.
  - name: Tracking
    description: Lenders connecting their own FIO API key. Needs a Discord sign-in.
  - name: Reporting
    description: Needs a lender API key.
  - name: Maintainers
    description: Blocking accounts and rolling back their changes. Needs a maintainer's Discord sign-in.

paths:
  /search:
    get:
      tags: [Borrowers]
      summary: Find borrowers and lenders
      description: Matches part of a username (current or former), or an exact company code.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        '200':
          description: Matches, up to 25 of each.
          content:
            application/json:
              schema:
                type: object
                required: [borrowers, lenders]
                properties:
                  borrowers:
                    type: array
                    items:
                      type: object
                      required: [username, companyCode, corpCode, loans]
                      properties:
                        username: { type: string }
                        companyCode: { type: [string, 'null'] }
                        corpCode: { type: [string, 'null'] }
                        loans: { type: integer }
                  lenders:
                    type: array
                    items:
                      type: object
                      required: [username, loans]
                      properties:
                        username: { type: string }
                        loans: { type: integer }
        '400': { $ref: '#/components/responses/Error' }

  /companies/{id}:
    get:
      tags: [Borrowers]
      summary: Everything on record about one company
      description: |
        Looks a player up by in-game username or by company code and returns their record both as a
        borrower and as a lender. Without `by`, the identifier is tried as a username first, then as a
        company code. Company codes match the borrower's current code and the code recorded on any of
        their loans.
      parameters:
        - name: id
          in: path
          required: true
          description: An in-game username or a company code.
          schema: { type: string }
        - name: by
          in: query
          description: Force how the identifier is read.
          schema: { type: string, enum: [username, code] }
      responses:
        '200':
          description: The company's record. `asBorrower` or `asLender` is null when there is nothing on that side.
          content:
            application/json:
              schema:
                type: object
                required: [company, matchedBy, asBorrower, asLender]
                properties:
                  company:
                    type: object
                    required: [username, companyCode, corpCode, aliases]
                    properties:
                      username: { type: string }
                      companyCode: { type: [string, 'null'] }
                      corpCode: { type: [string, 'null'] }
                      aliases:
                        type: array
                        items: { type: string }
                  matchedBy: { type: string, enum: [username, code] }
                  asBorrower:
                    oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/CompanySide'
                  asLender:
                    oneOf:
                      - type: 'null'
                      - allOf:
                          - $ref: '#/components/schemas/CompanySide'
                          - type: object
                            required: [trackingMode]
                            properties:
                              trackingMode: { $ref: '#/components/schemas/TrackingMode' }
        '300':
          description: The company code has been recorded against more than one player. Ask again by username.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    required: [matches]
                    properties:
                      matches:
                        type: array
                        items:
                          type: object
                          required: [username, companyCode, corpCode]
                          properties:
                            username: { type: string }
                            companyCode: { type: [string, 'null'] }
                            corpCode: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /borrowers/{username}:
    get:
      tags: [Borrowers]
      summary: A borrower's record
      description: Exposure per currency and every loan reported for this borrower (newest first, up to 500). Former usernames resolve to the current one.
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: The borrower's record.
          content:
            application/json:
              schema:
                type: object
                required: [borrower, exposure, combined, loans]
                properties:
                  borrower: { $ref: '#/components/schemas/Borrower' }
                  combined: { $ref: '#/components/schemas/Combined' }
                  exposure:
                    type: array
                    items: { $ref: '#/components/schemas/Exposure' }
                  loans:
                    type: array
                    items: { $ref: '#/components/schemas/Loan' }
        '404':
          description: No lender has reported a loan to this borrower.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /lenders:
    get:
      tags: [Lenders]
      summary: All lenders with per-currency figures
      responses:
        '200':
          description: Every lender.
          content:
            application/json:
              schema:
                type: object
                required: [lenders]
                properties:
                  lenders:
                    type: array
                    items:
                      type: object
                      required: [username, trackingMode, loans, exposure, combined]
                      properties:
                        username: { type: string }
                        combined: { $ref: '#/components/schemas/Combined' }
                        trackingMode: { $ref: '#/components/schemas/TrackingMode' }
                        loans: { type: integer, description: Cash loans only. }
                        exposure:
                          type: array
                          items: { $ref: '#/components/schemas/Exposure' }

  /lenders/{username}:
    get:
      tags: [Lenders]
      summary: A lender's figures
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: The lender.
          content:
            application/json:
              schema:
                type: object
                required: [lender, exposure, combined]
                properties:
                  lender: { $ref: '#/components/schemas/Lender' }
                  combined: { $ref: '#/components/schemas/Combined' }
                  exposure:
                    type: array
                    items: { $ref: '#/components/schemas/Exposure' }
        '404': { $ref: '#/components/responses/Error' }

  /lenders/{username}/loans:
    get:
      tags: [Lenders]
      summary: A lender's loans
      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Currency'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/LoanPage' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /lenders/{username}/loans/{contractId}:
    put:
      tags: [Reporting]
      summary: Report a loan
      description: |
        Creates or updates one of the lender's own loans. Idempotent by contract ID: the first report
        creates the loan, a later one updates the fields that differ, and an identical one changes nothing.
        The loan is labelled `lender_reported`.

        For lending with no in-game contract (an advance, a sponsored base), use a reference of your own as
        the contract ID: 1 to 16 letters and digits, unique across the bureau.

        A first report must carry borrower, principal, issuedOn and status. Later ones may send only what
        changed. `lender`, `contractId` and `autoTrack` in the body are ignored.

        **Overriding FIO.** A report that changes anything other than notes on one of the lender's loans kept up to
        date from FIO is applied, and switches FIO tracking off for that loan, so the sync does not put FIO's values
        back. `changed` then includes `autoTrack`, and the loan's history records the reason. A report matching what is
        recorded changes nothing and leaves tracking on. Switch tracking back on with
        `/lenders/{username}/loans/{contractId}/tracking`. To add notes without touching tracking, use
        `/lenders/{username}/loans/{contractId}/notes`.

        Refused with 409 when the contract is recorded under another lender or was deleted from the bureau.
      security:
        - lenderKey: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - name: contractId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9]{1,16}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoanReport' }
            example:
              borrower: SomePlayer
              principal: '2,500,000'
              currency: NCC
              issuedOn: '2026-11-10'
              durationWeeks: 6
              status: In Progress
              notes: Advance for materials
      responses:
        '200':
          description: The loan was already on record; `changed` lists the fields this report altered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResult' }
        '201':
          description: The loan was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401':
          description: No key, or a key the bureau does not know.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The key belongs to a different lender.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Recorded under another lender, or deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /lenders/{username}/loans/{contractId}/notes:
    put:
      tags: [Reporting]
      summary: Set or add to a loan's notes
      description: |
        Changes only the notes on one of the lender's own loans. On a loan kept up to date from FIO, tracking stays on
        (a report would switch it off). The loan must already be in the bureau, under this lender, and not deleted.
        The trust label does not change.

        Send one of:
        - `notes`: replace the notes (null or empty clears them). Add `expected` with the notes you last read to be
          refused (409) instead of overwriting a change someone else made since. The 409 carries the loan as it is now.
        - `append`: add a line at the end, keeping whatever is there.

        Every change is recorded in the loan's history under the lender's name. Sending the notes it already has changes nothing.
      security:
        - lenderKey: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - name: contractId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [notes]
                  properties:
                    notes: { type: [string, 'null'], maxLength: 2000 }
                    expected: { type: [string, 'null'], description: The notes as you last read them. }
                - type: object
                  additionalProperties: false
                  required: [append]
                  properties:
                    append: { type: string, minLength: 1, description: A line to add at the end. The result must stay within 2,000 characters. }
            examples:
              append:
                value: { append: '2026-12-01: missed the 48-hour return on an overdraft conversion (ISDB)' }
              replace:
                value: { notes: 'Repaid in full after a late return', expected: 'Missed a return' }
      responses:
        '200':
          description: The loan after the change; `changed` is `["notes"]`, or empty when nothing changed.
          content:
            application/json:
              schema:
                type: object
                required: [loan, changed]
                properties:
                  loan: { $ref: '#/components/schemas/Loan' }
                  changed:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401':
          description: No key, or a key the bureau does not know.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The key belongs to a different lender.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: The contract is not in the bureau.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Recorded under another lender, deleted, or (with `expected`) the notes changed since they were read.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      loan: { $ref: '#/components/schemas/Loan' }
        '429': { $ref: '#/components/responses/Error' }

  /lenders/{username}/loans/{contractId}/tracking:
    put:
      tags: [Reporting]
      summary: Switch FIO tracking on or off for a loan
      description: |
        Turns automatic tracking from FIO on or off for one of the lender's own loans. Nothing else about the loan changes.

        - `true` hands the loan back to the FIO sync, which updates its status and duration from FIO from the next hourly run.
          Use it after a report overrode FIO and the override is no longer needed. Needs the lender's FIO account connected
          (409 otherwise), and only makes sense for a loan with a real in-game contract ID: a loan FIO never returns is
          eventually marked Stale. Once FIO's lender, amount and currency agree with the loan, its label returns to `fio_verified`.
        - `false` stops the sync changing the loan.

        Every change is recorded in the loan's history under the lender's name. Asking for the current setting changes nothing.
      security:
        - lenderKey: []
      parameters:
        - $ref: '#/components/parameters/Username'
        - name: contractId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [autoTrack]
              properties:
                autoTrack: { type: boolean }
            example: { autoTrack: true }
      responses:
        '200':
          description: The loan after the change; `changed` is `["autoTrack"]`, or empty when it was already set that way.
          content:
            application/json:
              schema:
                type: object
                required: [loan, changed]
                properties:
                  loan: { $ref: '#/components/schemas/Loan' }
                  changed:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401':
          description: No key, or a key the bureau does not know.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The key belongs to a different lender.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: The contract is not in the bureau.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Recorded under another lender, deleted, or (turning tracking on) the lender's FIO account is not connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /lender-keys:
    post:
      tags: [Tracking]
      summary: Create or replace a lender's reporting API key
      description: |
        For a lender the signed-in user connected through FIO. The key is returned once and only its hash
        is kept, so store it straight away. Creating a new key retires the old one.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, description: The lender to create the key for. }
      responses:
        '201':
          description: The new key.
          content:
            application/json:
              schema:
                type: object
                required: [username, apiKey, prefix]
                properties:
                  username: { type: string }
                  apiKey: { type: string, description: 'Send as "Authorization: Bearer <key>". Shown this once.' }
                  prefix: { type: string, description: The first characters, shown later to identify the key. }
        '401': { $ref: '#/components/responses/Error' }
        '409':
          description: The lender is not connected through FIO, or someone else connected it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /lender-keys/{username}:
    delete:
      tags: [Tracking]
      summary: Revoke a lender's reporting API key
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Revoked.
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /loans:
    post:
      tags: [Editing]
      summary: Add a loan
      description: Adds a manual entry, labelled `community_edited`. Lender and borrower are created if new.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LoanEdit'
                - required: [lender, borrower, principal, issuedOn, status]
      responses:
        '201': { $ref: '#/components/responses/EditedLoan' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    get:
      tags: [Loans]
      summary: List loans
      description: Newest first.
      parameters:
        - { name: lender, in: query, schema: { type: string } }
        - { name: borrower, in: query, schema: { type: string } }
        - { name: contractId, in: query, schema: { type: string }, description: In-game contract ID. }
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Currency'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/LoanPage' }
        '400': { $ref: '#/components/responses/Error' }

  /loans/{id}/restore:
    post:
      tags: [Editing]
      summary: Restore a deleted loan
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/LoanId'
      responses:
        '200': { $ref: '#/components/responses/EditedLoan' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /fio-keys:
    get:
      tags: [Tracking]
      summary: Lenders you have connected
      security:
        - session: []
      responses:
        '200':
          description: The lenders whose FIO key you connected. Keys themselves are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [lenders]
                properties:
                  lenders:
                    type: array
                    items:
                      type: object
                      required: [username, connectedAt]
                      properties:
                        username: { type: string }
                        connectedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Tracking]
      summary: Connect a lender's FIO API key
      description: |
        The bureau asks FIO whose key it is and connects that account; no username is sent. The key is
        stored encrypted and used only to read that account's loan contracts. The lender is switched to
        automatic tracking and a sync starts straight away.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties:
                apiKey: { type: string, description: A FIO API key created by the lender's own FIO account. }
      responses:
        '201':
          description: Connected.
          content:
            application/json:
              schema:
                type: object
                required: [lender, contractsFound, loansFound]
                properties:
                  lender:
                    type: object
                    required: [username, trackingMode]
                    properties:
                      username: { type: string }
                      trackingMode: { $ref: '#/components/schemas/TrackingMode' }
                  contractsFound: { type: integer, description: Loan contracts FIO returned for the account. }
                  loansFound: { type: integer, description: Of those, live loans this account paid out. }
        '400':
          description: FIO does not recognise the key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '502':
          description: FIO could not be reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Connecting keys is not configured on this server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /fio-keys/{username}:
    delete:
      tags: [Tracking]
      summary: Disconnect a lender
      description: Deletes the stored key and stops automatic tracking. Only the person who connected the lender may do this.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Username'
      responses:
        '200':
          description: Disconnected.
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Someone else connected this lender.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/blocks:
    get:
      tags: [Maintainers]
      summary: Accounts blocked from making changes
      security:
        - session: []
      responses:
        '200':
          description: The blocked accounts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockList' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Maintainers]
      summary: Block an account
      description: A blocked account can still read everything but every write it attempts is refused with 403.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actorId]
              properties:
                actorId: { type: string, description: 'A Discord user ID, or "lender:<id>" for a lender API key.' }
                name: { type: string }
                reason: { type: string, maxLength: 300 }
      responses:
        '201':
          description: Blocked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockList' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/blocks/{actorId}:
    delete:
      tags: [Maintainers]
      summary: Unblock an account
      security:
        - session: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Unblocked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockList' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/rollback:
    post:
      tags: [Maintainers]
      summary: Undo everything one account changed since a moment in time
      description: |
        For each loan the account touched: a loan it added is deleted, a loan it deleted is restored, and
        each field it changed returns to what it held before the account's first change in the period.
        A field someone else has changed since is left alone and listed in `skipped`. The rollback is
        recorded in each loan's history and in `/changes` under the maintainer who ran it, with a reason naming
        whose changes it undid and since when. Running it twice is harmless.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actorId, since]
              properties:
                actorId: { type: string, description: 'A Discord user ID, or "lender:<id>" for a lender API key.' }
                since: { type: string, format: date-time }
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: What was done.
          content:
            application/json:
              schema:
                type: object
                required: [loans, removed, restored, reverted, skipped]
                properties:
                  loans: { type: integer, description: Loans the account touched in the period. }
                  removed: { type: integer, description: Loans it had added, now deleted. }
                  restored: { type: integer, description: Loans it had deleted, now back. }
                  reverted: { type: integer, description: Loans with at least one field put back. }
                  skipped:
                    type: array
                    items: { type: string }
                    description: 'Fields left alone because someone else changed them since, e.g. "loan #12: status".'
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /updates:
    get:
      tags: [Bureau]
      summary: Loans changed since a moment in time
      description: |
        Includes deleted loans (`deletedAt` set), oldest change first, up to 500. Not cached. Pass the returned
        `cursor` as `since` on the next call. A loan may be returned more than once.
      parameters:
        - name: since
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Changed loans and the cursor for the next call.
          content:
            application/json:
              schema:
                type: object
                required: [loans, cursor]
                properties:
                  loans:
                    type: array
                    items: { $ref: '#/components/schemas/Loan' }
                  cursor: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }

  /changes:
    get:
      tags: [Bureau]
      summary: Recent changes to loans, newest first
      parameters:
        - name: system
          in: query
          description: Set to 1 to include automatic changes made by the FIO sync.
          schema: { type: string, enum: ['1'] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of changes.
          content:
            application/json:
              schema:
                type: object
                required: [changes, limit, offset]
                properties:
                  changes:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Revision'
                        - type: object
                          required: [loanId, contractId, lender, borrower, loanDeleted, loanTracked]
                          properties:
                            loanId: { type: integer }
                            contractId: { type: [string, 'null'] }
                            lender: { type: string }
                            borrower: { type: string }
                            loanDeleted: { type: boolean }
                            loanTracked: { type: boolean }
                  limit: { type: integer }
                  offset: { type: integer }

  /loans/{id}:
    patch:
      tags: [Editing]
      summary: Edit a loan
      description: |
        Send only the fields to change. Sending current values changes nothing and records nothing.

        To avoid overwriting someone else's edit, also send `expected`: the values you were looking at for the
        fields you are changing. If any of them no longer matches, nothing is saved and the response is 409
        with the loan as it is now.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/LoanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LoanEdit'
                - type: object
                  properties:
                    expected: { $ref: '#/components/schemas/LoanEdit' }
      responses:
        '200':
          description: The loan after the edit, and which fields changed.
          content:
            application/json:
              schema:
                type: object
                required: [loan, changed]
                properties:
                  loan: { $ref: '#/components/schemas/Loan' }
                  changed:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Someone changed the value first, the loan is tracked from FIO or deleted, or the contract ID is already used.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      loan: { $ref: '#/components/schemas/Loan' }
    delete:
      tags: [Editing]
      summary: Delete a loan
      description: Hides the loan from lists and totals. It keeps its history and can be restored. Tracked loans cannot be deleted.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/LoanId'
      responses:
        '200': { $ref: '#/components/responses/EditedLoan' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    get:
      tags: [Loans]
      summary: One loan with its status history and version history
      description: "`id` is the bureau's loan ID. To look up by in-game contract ID use `/loans?contractId=`."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The loan.
          content:
            application/json:
              schema:
                type: object
                required: [loan, statusHistory, revisions]
                properties:
                  loan: { $ref: '#/components/schemas/Loan' }
                  statusHistory:
                    type: array
                    items: { $ref: '#/components/schemas/StatusChange' }
                  revisions:
                    type: array
                    items: { $ref: '#/components/schemas/Revision' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /leaderboards:
    get:
      tags: [Bureau]
      summary: Top 20 lenders, per currency and combined
      responses:
        '200':
          description: One board per currency, plus a combined board.
          content:
            application/json:
              schema:
                type: object
                required: [leaderboards, combined]
                properties:
                  combined:
                    description: |
                      All four currencies added together at face value, with no exchange rate applied.
                      A rough measure of scale only; this is the one place amounts are added across currencies.
                    type: object
                    required: [byTotal, byCurrent]
                    properties:
                      byTotal:
                        type: array
                        items: { $ref: '#/components/schemas/LeaderboardEntry' }
                      byCurrent:
                        type: array
                        items: { $ref: '#/components/schemas/LeaderboardEntry' }
                  leaderboards:
                    type: array
                    items:
                      type: object
                      required: [currency, byTotal, byCurrent]
                      properties:
                        currency: { $ref: '#/components/schemas/Currency' }
                        byTotal:
                          description: By everything lent, all time.
                          type: array
                          items: { $ref: '#/components/schemas/LeaderboardEntry' }
                        byCurrent:
                          description: By what is out on loan now.
                          type: array
                          items: { $ref: '#/components/schemas/LeaderboardEntry' }

  /stats:
    get:
      tags: [Bureau]
      summary: Bureau-wide counts and per-currency totals
      responses:
        '200':
          description: Totals.
          content:
            application/json:
              schema:
                type: object
                required: [loans, lenders, borrowers, exposure, combined]
                properties:
                  combined: { $ref: '#/components/schemas/Combined' }
                  loans: { type: integer }
                  lenders: { type: integer }
                  borrowers: { type: integer }
                  exposure:
                    type: array
                    items: { $ref: '#/components/schemas/Exposure' }

  /sync:
    get:
      tags: [Bureau]
      summary: Latest FIO sync result for each automatically tracked lender
      responses:
        '200':
          description: Sync health.
          content:
            application/json:
              schema:
                type: object
                required: [lenders]
                properties:
                  lenders:
                    type: array
                    items: { $ref: '#/components/schemas/SyncHealth' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: Set by signing in with Discord at `/auth/login`.
    lenderKey:
      type: http
      scheme: bearer
      description: 'A lender API key, created on the Track my loans page. Sent as "Authorization: Bearer <key>".'

  parameters:
    LoanId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Username:
      name: username
      in: path
      required: true
      schema: { type: string }
    Status:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/Status' }
    Currency:
      name: currency
      in: query
      schema: { $ref: '#/components/schemas/Currency' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Error:
      description: The request could not be served.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EditedLoan:
      description: The loan after the change.
      content:
        application/json:
          schema:
            type: object
            required: [loan]
            properties:
              loan: { $ref: '#/components/schemas/Loan' }
    LoanPage:
      description: A page of loans.
      content:
        application/json:
          schema:
            type: object
            required: [loans, total, limit, offset]
            properties:
              loans:
                type: array
                items: { $ref: '#/components/schemas/Loan' }
              total: { type: integer, description: Loans matching the filters, across all pages. }
              limit: { type: integer }
              offset: { type: integer }

  schemas:
    Currency:
      type: string
      enum: [AIC, CIS, ICA, NCC]
    Status:
      type: string
      enum: [in_progress, complete, overdue, breached, terminated, stale]
      description: |
        - `in_progress`: paid out and being repaid
        - `overdue`: a payment deadline has passed
        - `breached`: the contract was breached in game
        - `complete`: fully repaid
        - `terminated`: ended early (cancelled offer or negotiated exit); not counted in totals
        - `stale`: long past maturity and no longer reported by FIO; outcome unknown
    Trust:
      type: string
      enum: [fio_verified, lender_reported, community_edited]
      description: |
        - `fio_verified`: checked against FIO game data
        - `lender_reported`: sent by the lender, not verified
        - `community_edited`: entered or changed by someone else
    TrackingMode:
      type: string
      enum: [fio, api, manual]
    LoanType:
      type: [string, 'null']
      enum: [stable, interest, annuity, advance, sponsored_base, other, null]
      description: "`null` means unknown."
    Amount:
      type: string
      pattern: '^\d+\.\d{2}$'
      examples: ['25000000.00']

    Borrower:
      type: object
      required: [id, username, companyCode, corpCode, aliases]
      properties:
        id: { type: integer }
        username: { type: string }
        companyCode: { type: [string, 'null'], description: First company code seen for this borrower. }
        corpCode: { type: [string, 'null'] }
        aliases:
          type: array
          items: { type: string }
          description: Former usernames.

    Lender:
      type: object
      required: [id, username, companyCode, trackingMode]
      properties:
        id: { type: integer }
        username: { type: string }
        companyCode: { type: [string, 'null'] }
        trackingMode: { $ref: '#/components/schemas/TrackingMode' }

    Loan:
      type: object
      required:
        [id, contractId, lender, borrower, principal, currency, issuedOn, durationWeeks, maturesOn, loanType, status,
         everBreached, outstanding, notes, trust, source, autoTrack, lastSyncedAt, updatedAt, deletedAt]
      properties:
        id: { type: integer, description: Bureau loan ID. }
        contractId: { type: [string, 'null'], description: In-game contract ID; null for entries without one. }
        lender: { type: string }
        borrower:
          type: object
          required: [username, companyCode, corpCode]
          properties:
            username: { type: string }
            companyCode: { type: [string, 'null'], description: As recorded on this loan. }
            corpCode: { type: [string, 'null'], description: As recorded on this loan. }
        principal: { $ref: '#/components/schemas/Amount' }
        currency:
          oneOf:
            - $ref: '#/components/schemas/Currency'
            - type: 'null'
        issuedOn: { type: string, format: date }
        durationWeeks: { type: [number, 'null'] }
        maturesOn: { type: [string, 'null'], format: date }
        loanType: { $ref: '#/components/schemas/LoanType' }
        status: { $ref: '#/components/schemas/Status' }
        everBreached: { type: boolean, description: True if the loan is, or ever was, breached. }
        outstanding:
          description: Principal still owed, when known.
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
        notes: { type: [string, 'null'] }
        trust: { $ref: '#/components/schemas/Trust' }
        source: { type: string, enum: [fio, api, manual, sheet_import] }
        autoTrack: { type: boolean, description: True if the FIO sync keeps this loan up to date. }
        lastSyncedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time, description: Set when the loan has been deleted. }

    LoanEdit:
      type: object
      additionalProperties: false
      properties:
        lender: { type: string, maxLength: 64 }
        borrower: { type: string, maxLength: 64 }
        companyCode: { type: [string, 'null'], maxLength: 8 }
        corpCode: { type: [string, 'null'], maxLength: 8 }
        principal: { type: string, description: 'A number; thousands separators are accepted, e.g. "25,000,000".' }
        currency: { type: [string, 'null'], description: 'AIC, CIS, ICA, NCC, or null / "N/A" for non-cash.' }
        issuedOn: { type: string, format: date }
        durationWeeks: { type: [number, string, 'null'] }
        status: { type: string, description: 'A status key or its label, e.g. "in_progress" or "In Progress".' }
        contractId: { type: [string, 'null'] }
        autoTrack: { type: boolean, description: Needs a contract ID. }
        notes: { type: [string, 'null'], maxLength: 2000 }

    LoanReport:
      type: object
      description: The fields of a report. A first report needs borrower, principal, issuedOn and status.
      additionalProperties: false
      properties:
        borrower: { type: string, maxLength: 64, description: Borrower's username. }
        companyCode: { type: [string, 'null'], maxLength: 8, description: Borrower's company code. }
        corpCode: { type: [string, 'null'], maxLength: 8 }
        principal: { type: string, description: 'A number; thousands separators are accepted, e.g. "25,000,000".' }
        currency: { type: [string, 'null'], description: 'AIC, CIS, ICA, NCC, or null / "N/A" for non-cash.' }
        issuedOn: { type: string, format: date }
        durationWeeks: { type: [number, string, 'null'] }
        status: { type: string, description: 'A status key or its label, e.g. "in_progress" or "In Progress".' }
        notes: { type: [string, 'null'], maxLength: 2000 }

    ReportResult:
      type: object
      required: [loan, created, changed]
      properties:
        loan: { $ref: '#/components/schemas/Loan' }
        created: { type: boolean }
        changed:
          type: array
          items: { type: string }
          description: Fields this report altered. Empty when it matched what was on record.

    Exposure:
      type: object
      description: Figures for one currency.
      required: [currency, loans, total, current, stale, breachedLoans, everBreachedLoans, overdueLoans, terminatedLoans]
      properties:
        currency:
          oneOf:
            - $ref: '#/components/schemas/Currency'
            - type: 'null'
        loans: { type: integer, description: All loans, including terminated ones. }
        total: { allOf: [{ $ref: '#/components/schemas/Amount' }], description: Everything lent, leaving out terminated loans. }
        current: { allOf: [{ $ref: '#/components/schemas/Amount' }], description: In Progress plus Overdue. }
        stale: { allOf: [{ $ref: '#/components/schemas/Amount' }], description: Outcome unknown. }
        breachedLoans: { type: integer, description: Loans in breach now. }
        everBreachedLoans: { type: integer, description: Loans that are or ever were in breach. }
        overdueLoans: { type: integer }
        terminatedLoans: { type: integer }

    BlockList:
      type: object
      required: [blocks]
      properties:
        blocks:
          type: array
          items:
            type: object
            required: [actorId, name, reason, blockedBy, blockedAt]
            properties:
              actorId: { type: string }
              name: { type: [string, 'null'] }
              reason: { type: [string, 'null'] }
              blockedBy: { type: string }
              blockedAt: { type: string, format: date-time }

    CompanySide:
      type: object
      description: One side of a company's record, as borrower or as lender.
      required: [exposure, combined, loans, totalLoans]
      properties:
        exposure:
          type: array
          items: { $ref: '#/components/schemas/Exposure' }
        combined: { $ref: '#/components/schemas/Combined' }
        loans:
          description: Newest first, up to 500. Use /loans with a lender or borrower filter to page through more.
          type: array
          items: { $ref: '#/components/schemas/Loan' }
        totalLoans: { type: integer }

    Combined:
      type: object
      description: |
        Figures across all four currencies, added at face value with no exchange rate applied.
        A rough measure of scale; the per-currency figures in `exposure` are the exact ones.
      required: [loans, nonCashLoans, total, current, stale, breachedLoans, everBreachedLoans, overdueLoans, terminatedLoans]
      properties:
        loans: { type: integer, description: Cash loans, including terminated ones. }
        nonCashLoans: { type: integer, description: Loans with no currency. Not included in any amount. }
        total: { allOf: [{ $ref: '#/components/schemas/Amount' }], description: Everything lent, leaving out terminated loans. }
        current: { allOf: [{ $ref: '#/components/schemas/Amount' }], description: In Progress plus Overdue. }
        stale: { allOf: [{ $ref: '#/components/schemas/Amount' }], description: Outcome unknown. }
        breachedLoans: { type: integer }
        everBreachedLoans: { type: integer }
        overdueLoans: { type: integer }
        terminatedLoans: { type: integer }

    StatusChange:
      type: object
      required: [oldStatus, newStatus, changedAt, source]
      properties:
        oldStatus:
          description: null when the loan was first seen.
          oneOf:
            - $ref: '#/components/schemas/Status'
            - type: 'null'
        newStatus: { $ref: '#/components/schemas/Status' }
        changedAt: { type: string, format: date-time }
        source: { type: string, enum: [fio_sync, api, edit, sheet_import] }

    Revision:
      type: object
      required: [id, action, actorType, actor, actorId, before, after, createdAt]
      properties:
        id: { type: integer }
        action: { type: string, enum: [import, create, update, delete] }
        actorType: { type: string, enum: [system, lender, user], description: A Discord user, a lender through their API key, or a bureau job. }
        actor: { type: string, description: 'Discord username, or the name of the system job.' }
        actorId: { type: [string, 'null'], description: Discord user ID; null for system changes. }
        before: { description: Values before the change; null for the first version. }
        after: { description: Values after the change. }
        createdAt: { type: string, format: date-time }

    LeaderboardEntry:
      type: object
      required: [rank, lender, amount]
      properties:
        rank: { type: integer }
        lender: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }

    SyncHealth:
      type: object
      required: [lender, checkedAt, httpStatus, contractsReturned, loansKept, error, ok]
      properties:
        lender: { type: string }
        checkedAt: { type: string, format: date-time }
        httpStatus: { type: [integer, 'null'], description: FIO's HTTP response code. 401 means FIO rejected the key the lender connected. }
        contractsReturned: { type: [integer, 'null'] }
        loansKept: { type: [integer, 'null'], description: Contracts where this lender paid out the loan. }
        error: { type: [string, 'null'] }
        ok: { type: boolean }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [bad_request, unauthorized, forbidden, blocked, not_found, conflict, ambiguous, rate_limited, fio_unreachable, unavailable, internal_error] }
            message: { type: string }
